name: 交割日提醒 (北京时间每天8点)

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      days_ahead:
        description: "提前多少天检查 (默认值: 2)"
        required: false
        default: "2"
        type: string

jobs:
  check-delivery:
    runs-on: ubuntu-latest
    name: 检查交割日并发送提醒

    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dateutil
          fi

      - name: 运行交割日检查脚本
        run: |
          # 这里替换成你的 Python 脚本
          python3 -c "
import requests
from datetime import datetime, timedelta
import os

# 获取输入参数（手动触发时可用）
days_ahead = int(os.getenv('INPUT_DAYS_AHEAD', '2'))

# 获取当前时间（UTC+8 北京时间）
now = datetime.utcnow() + timedelta(hours=8)
today = now.date()

# 检查未来几天是否是交割日（示例逻辑）
def is_delivery_day(date):
    # 这里替换成你的交割日判断逻辑
    # 示例：假设每月第3个周五是交割日
    if date.weekday() == 4 and 15 <= date.day <= 21:
        return True
    return False

# 检查未来几天
reminder_days = []
for i in range(days_ahead + 1):
    check_date = today + timedelta(days=i)
    if is_delivery_day(check_date):
        reminder_days.append(check_date.strftime('%Y-%m-%d'))

# 如果有交割日，发送提醒（示例：通过 Webhook）
if reminder_days:
    webhook_url = 'https://your-webhook-url.example.com'
    message = f'⚠️ 交割日提醒：未来{days_ahead}天内有以下交割日：{", ".join(reminder_days)}'
    payload = {'text': message}
    requests.post(webhook_url, json=payload)
    print('已发送提醒:', message)
else:
    print(f'未来{days_ahead}天内无交割日')
          "
        env:
          INPUT_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '2' }}
