name: 交割日提醒每小时
on:
  schedule:
    - cron: "0 * * * *"  # 每小时整点（UTC）
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "提前多少天检查(默认2天)"
        required: false
        default: "2"
        type: string

jobs:
  check-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 显式声明权限
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install requests

      - name: 运行检查脚本
        env:
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
          TZ: "Asia/Shanghai"
        run: |
          echo "当前UTC时间: $(date -u)"
          echo "当前北京时间: $(TZ=Asia/Shanghai date)"
          python check_delivery.py ${{ inputs.days_ahead || '2' }}

      - name: 上传日志(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: |
            *.log
            *.txt
